<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fixated Creator Program</title>
  <meta name="description" content="Fixated is building a creator program for indie and new BL artists. Join the waitlist.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #120A14; --surface: #1E0F22; --border: rgba(169, 143, 203, 0.22);
      --text: #F5EEF8; --text-2: #C4A8D4; --text-3: #7A5A8A;
      --gold: #C8A96A; --rose: #C97C9E;
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body { margin: 0; background: var(--bg); color: var(--text); font-family: Inter, -apple-system, "Segoe UI", sans-serif; line-height: 1.6; }
    main { max-width: 640px; margin: 0 auto; padding: 40px 16px 64px; }
    .langs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 32px; }
    .langs button { font: 500 14px Inter, sans-serif; color: var(--text-3); background: transparent; border: 1px solid var(--border); border-radius: 4px; padding: 6px 12px; cursor: pointer; }
    .langs button[aria-pressed="true"] { color: var(--text); border-color: var(--gold); background: rgba(200, 169, 106, 0.12); }
    .kicker { font-size: 12px; font-weight: 500; letter-spacing: 2px; color: var(--gold); margin: 0; }
    h1 { font-family: "Cormorant Garamond", serif; font-weight: 700; font-size: clamp(32px, 7vw, 44px); line-height: 1.1; margin: 8px 0 20px; }
    .rule { width: 110px; height: 1px; background: var(--gold); opacity: 0.6; margin-bottom: 24px; }
    p { color: var(--text-2); margin: 0 0 16px; }
    .note { border-left: 2px solid var(--gold); padding-left: 12px; margin-bottom: 20px; }
    .note strong { display: block; color: var(--gold); font-size: 14px; }
    .note p { font-style: italic; font-size: 15px; margin: 4px 0 0; }
    .waitlist { background: var(--surface); border: 1px solid rgba(200, 169, 106, 0.25); border-radius: 6px; padding: 14px 16px; color: var(--text); margin-bottom: 28px; }
    form { display: grid; gap: 16px; }
    label { display: grid; gap: 6px; font-size: 13px; font-weight: 600; letter-spacing: 1px; color: var(--text-3); }
    input, textarea { font: 400 16px Inter, sans-serif; color: var(--text); background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 12px 14px; width: 100%; }
    textarea { min-height: 80px; resize: vertical; }
    input:focus, textarea:focus { outline: 2px solid var(--gold); outline-offset: 1px; }
    .consent { display: flex; gap: 10px; align-items: flex-start; font-size: 15px; font-weight: 400; letter-spacing: 0; color: var(--text-2); }
    .consent input { width: 20px; height: 20px; margin-top: 2px; accent-color: var(--gold); flex: none; }
    .trap { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }
    button.submit { font: 600 16px Inter, sans-serif; color: #fff; background: var(--rose); border: 0; border-radius: 6px; padding: 15px; cursor: pointer; }
    button.submit:disabled { opacity: 0.6; cursor: default; }
    .error { color: var(--rose); font-weight: 500; margin: 0; min-height: 1em; }
    .privacy { font-size: 13px; color: var(--text-3); }
    .done { text-align: center; padding: 24px 0; }
    .done h2 { font-family: "Cormorant Garamond", serif; font-size: 30px; margin: 0 0 8px; }
    footer { margin-top: 48px; font-size: 13px; color: var(--text-3); }
    footer a { color: var(--text-2); }
  </style>
</head>
<body>
  <main>
    <nav class="langs" id="langs" aria-label="Language"></nav>
    <p class="kicker" data-t="kicker"></p>
    <h1 data-t="heading"></h1>
    <div class="rule"></div>
    <div class="note" id="note" hidden><strong data-t="noteLabel"></strong><p data-t="disclaimer"></p></div>
    <p data-t="intro"></p>
    <p data-t="aims"></p>
    <div class="waitlist" data-t="waitlist"></div>

    <form id="form" novalidate>
      <label><span data-t="name"></span><input name="name" maxlength="100" autocomplete="name"></label>
      <label><span data-t="handle"></span><input name="handle" maxlength="300" autocapitalize="none"></label>
      <label><span data-t="country"></span><input name="country" maxlength="100" autocomplete="country-name"></label>
      <label><span data-t="language"></span><input name="language" maxlength="100"></label>
      <label><span data-t="email"></span><input name="email" type="email" maxlength="254" autocomplete="email" autocapitalize="none"></label>
      <label id="noteField"><span data-t="translationNote"></span><textarea name="translation_note" maxlength="1000"></textarea></label>
      <div class="trap" aria-hidden="true"><input name="website" tabindex="-1" autocomplete="off"></div>
      <label class="consent"><input type="checkbox" name="consent"><span data-t="consent"></span></label>
      <p class="error" id="error" role="alert"></p>
      <button class="submit" type="submit" data-t="submit"></button>
      <p class="privacy" data-t="privacy"></p>
    </form>
    <div class="done" id="done" hidden><h2 data-t="successTitle"></h2><p data-t="successBody"></p></div>

    <footer>Fixated · <a href="privacy.html">Privacy Policy</a></footer>
  </main>

      const fromUrl = new URLSearchParams(location.search).get('lang');
      if (fromUrl && COPY.languages[fromUrl]) return fromUrl;
      for (const l of navigator.languages || [navigator.language || 'en']) {
        const lower = l.toLowerCase();
        if (lower.startsWith('zh')) return 'zh-Hant';
        if (lower.startsWith('pt')) return 'pt-BR';
        const base = lower.split('-')[0];
        if (COPY.languages[base]) return base;
      }
      return 'en';
    }

    let lang = pick();
    const langs = document.getElementById('langs');
    for (const code of COPY.order) {
      const b = document.createElement('button');
      b.type = 'button';
      b.textContent = COPY.languages[code].languageName;
      b.lang = code;
      b.addEventListener('click', () => { lang = code; render(); });
      langs.appendChild(b);
    }

    function render() {
      const t = COPY.languages[lang];
      document.documentElement.lang = lang;
      document.querySelectorAll('[data-t]').forEach((el) => { el.textContent = t[el.dataset.t]; });
      langs.querySelectorAll('button').forEach((b) => b.setAttribute('aria-pressed', String(b.lang === lang)));
      document.getElementById('note').hidden = t.reviewed || !t.disclaimer;
      document.getElementById('noteField').hidden = t.reviewed;
    }
    render();

    const form = document.getElementById('form');
    const error = document.getElementById('error');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const t = COPY.languages[lang];
      const f = new FormData(form);
      const v = (k) => String(f.get(k) || '').trim();
      if (!['name', 'handle', 'country', 'language', 'email'].every(v)) { error.textContent = t.errorFields; return; }
      if (!EMAIL_RE.test(v('email'))) { error.textContent = t.errorEmail; return; }
      if (!f.get('consent')) { error.textContent = t.errorConsent; return; }
      error.textContent = '';
      const button = form.querySelector('button.submit');
      button.disabled = true;
      button.textContent = t.sending;
      try {
        const res = await fetch(API, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            name: v('name'), handle: v('handle'), country: v('country'), language: v('language'), email: v('email'),
            consent: true, page_language: lang, translation_note: v('translation_note') || undefined,
            source: 'web', website: v('website') || undefined,
          }),
        });
        if (!res.ok) throw new Error(String(res.status));
        form.hidden = true;
        document.getElementById('done').hidden = false;
      } catch {
        error.textContent = t.errorGeneric;
        button.disabled = false;
        button.textContent = t.submit;
      }
    });
  </script>
</body>
</html>
